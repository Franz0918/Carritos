name: Java CI con Maven

on:
  push:
    branches: [ "main" ] # Se activa al hacer push a la rama main que usas

jobs:
  build:
    runs-on: ubuntu-latest # Máquina virtual Linux

    steps:
    # 1. Descarga tu código
    - name: Descargar codigo fuente
      uses: actions/checkout@v4

    # 2. Configura Java (Aseguramos la compatibilidad de compilación)
    - name: Configurar Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven

    # 3. Empaqueta el archivo ignorando temporalmente test si están vacíos o fallando en la nube
    - name: Compilar y Empaquetar con Maven
      run: mvn -B clean package -DskipTests

    # 4. Guarda tu archivo ejecutable para descargarlo en la web
    - name: Guardar el archivo JAR como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: microservicio-carros-ejecutable
        path: target/carros-*.jar
